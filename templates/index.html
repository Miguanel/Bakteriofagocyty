<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Mikro Arena: Cosmic Edition</title>
    <link rel="stylesheet" href="static/css/style.css">
    <script src="https://bernardo-castilho.github.io/DragDropTouch/DragDropTouch.js"></script>
</head>
<body class="cosmic-theme">
    <div id="tablet-wrapper">

        <div id="start-modal" class="fullscreen-modal">
            <div class="modal-content">
                <h1>🌌 COSMIC MICRO ARENA</h1>
                <div class="mode-selection">
                    <button id="btn-pve" class="mode-btn">VS AI</button>
                    <button id="btn-pvp" class="mode-btn selected">TABLET HOT-SEAT</button>
                </div>
                <div class="player-config">
                    <div class="p-setup" id="p1-setup">
                        <input type="text" id="p1-name" value="Komandor 1">
                        <div class="avatar-picker"><div id="p1-avatar-display" class="avatar-display">👨‍🚀</div></div>
                        <input type="color" id="p1-color" value="#00cec9">
                    </div>
                    <div class="p-setup" id="p2-setup">
                        <input type="text" id="p2-name" value="Obcy">
                        <div class="avatar-picker"><div id="p2-avatar-display" class="avatar-display">👽</div></div>
                        <input type="color" id="p2-color" value="#ff7675">
                    </div>
                </div>
                <button id="start-game-btn" class="big-action-btn">INICJUJ PROTOKÓŁ</button>
                <button id="resume-game-btn" class="big-action-btn" style="background:#f39c12; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); margin-top: 15px; display: none;">WZNÓW ZAPISANĄ GRĘ</button>
            </div>
        </div>

        <div id="game-ui" style="display: none; width: 100%; max-width: 1000px; padding: 10px; flex-direction: column; align-items: center;">

            <div id="top-hud-wrapper" class="cosmic-glass" style="width: 100%; display: flex; justify-content: space-between; align-items: center; padding: 8px 15px; border-radius: 8px; transform: rotate(180deg); margin-bottom: 10px; background: linear-gradient(90deg, rgba(0,0,0,0.8) 0%, rgba(20,30,40,0.8) 100%);">
                <div style="display:flex; align-items:center; gap: 15px;">
                    <span id="enemy-avatar-hud" style="font-size:24px;">👽</span>
                    <span style="font-weight:bold; font-size:16px;" id="enemy-name-hud">OBCY</span>
                </div>
                <div style="display:flex; align-items:center; gap: 15px;">
                    <span style="color:#ff7675; font-weight:bold;">❤️ BAZA: <span id="enemy-hp-text-top">500/500</span></span>
                    <span style="color:#00ffff; font-weight:bold;">🛡️ TARCZA: 100</span>
                </div>
            </div>

            <div id="phase-indicator" class="cosmic-glass" style="margin-bottom: 10px;">FAZA: INICJACJA</div>

            <div id="game-container" style="position: relative;">
                <canvas id="gameCanvas" width="800" height="450"></canvas>
                <canvas id="minimapCanvas-p1" class="minimap" width="100" height="100" style="display:none !important;"></canvas>
                <canvas id="minimapCanvas-p2" class="minimap" width="100" height="100" style="display:none !important;"></canvas>

                <div id="unit-hover-tooltip" class="hover-tooltip" style="display: none;">
                    <div id="tooltip-stats"></div>
                    <button id="tooltip-extract-btn" class="side-btn" style="width: 100%; margin-top: 10px;">📥 POBIERZ</button>
                </div>
            </div>

            <div id="unit-list-panel" class="cosmic-glass" style="width: 100%; padding: 10px; border-radius: 12px; margin-bottom: 10px; display: none;">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h3 style="margin: 0; color: var(--active-color);">🔬 STAN PROBÓWEK</h3>
                    <div id="ui-pipette-count" style="font-weight: bold; color: #00cec9;">🧪 PIPETY: 3/9</div>
                </div>
                <div id="details-list" class="details-list" style="max-height: 100px; display: flex; overflow-x: auto; gap: 5px;"></div>
                <div id="genome-slots" style="display: flex; gap: 5px; margin-top: 10px;">
                    <button onclick="saveGenome()" class="unit-action-btn" style="flex:1; background:rgba(142, 68, 173, 0.4);">💾 ZAPISZ GENOM</button>
                    <button onclick="loadGenome()" class="unit-action-btn" style="flex:1; background:rgba(41, 128, 185, 0.4);">📂 WCZYTAJ GENOM</button>
                </div>
            </div>

            <div id="bottom-hud-wrapper">
                <div id="cards-section">
                    <div id="motherbar-panel" class="cosmic-glass">
                        <div style="display:flex; align-items:center; gap: 15px;">
                            <span id="player-avatar-hud" style="font-size:24px;">👨‍🚀</span>
                            <span style="font-weight:bold; font-size:16px;" id="player-name-hud">KOMANDOR</span>
                        </div>
                        <div style="display:flex; align-items:center; gap: 15px;">
                            <span style="color:#55efc4; font-weight:bold;">❤️ BAZA: <span id="player-hp-text">500/500</span></span>
                            <span style="color:#00ffff; font-weight:bold;">🛡️ TARCZA: 100</span>
                        </div>
                        <div style="display:flex; align-items:center; gap: 15px;">
                            <span style="color:#f1c40f; font-weight:bold;">⚡ PRZYCHÓD: +<span id="details-total-atp">5</span>/turę</span>
                        </div>
                    </div>

                    <div id="dual-deck-container">
                        <div class="deck-row-wrapper">
                            <div class="deck-row-label" style="color:#2ecc71;">🧫 ORG</div>
                            <div class="deck-track" id="units-track"></div>
                        </div>
                        <div class="deck-row-wrapper">
                            <div class="deck-row-label" style="color:#9b59b6;">🧬 MUT</div>
                            <div class="deck-track" id="mutations-track"></div>
                        </div>
                    </div>
                </div>

                <div id="action-section">
                    <div id="atp-container" class="cosmic-glass">
                        <div id="atp-value">20</div>
                        <div id="atp-label">ATP</div>
                    </div>
                    <button id="action-btn" class="cosmic-btn">SKOK W NADPRZESTRZEŃ</button>
                    <div id="surrender-controls" style="display: none; margin-top: 10px;">
                        <button id="btn-surrender-p1" class="cosmic-btn" style="background:#c0392b; color:white; padding: 10px; font-size:12px;">🏳️ PODDAJ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
   <div id="bio-modal-overlay"></div>
    <div id="card-tooltip" class="cosmic-glass" style="display: none;"></div>

    <script type="module" src="static/js/main.js"></script>
    <script>
        const avatars = ["👨‍🚀", "👽", "🤖", "👹", "🦠", "🧬", "👑", "🌸", "🐙"];
        let p1Idx = 0, p2Idx = 1;
        window.changeAvatar = (p, dir) => {
            if(p === 'p1') {
                p1Idx = (p1Idx + dir + avatars.length) % avatars.length;
                document.getElementById('p1-avatar-display').innerText = avatars[p1Idx];
            } else {
                p2Idx = (p2Idx + dir + avatars.length) % avatars.length;
                document.getElementById('p2-avatar-display').innerText = avatars[p2Idx];
            }
        };
    </script>
</body>
</html>
